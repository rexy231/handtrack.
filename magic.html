<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:monospace;color:#9ff}
video{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,255,.05) 0 1px,transparent 1px 4px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65))}
#top{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:19px;letter-spacing:4px;text-shadow:0 0 10px #0ff;pointer-events:none}
#hint{position:fixed;bottom:84px;left:0;right:0;text-align:center;font-size:16px;color:#fff;text-shadow:0 0 8px #0ff;pointer-events:none;padding:0 16px}
#bar{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
#bar button{padding:12px 14px;font:bold 16px monospace;color:#fff;background:rgba(0,255,255,.15);border:2px solid #0ff;border-radius:26px}
#bar button.on{background:#0ff;color:#012}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="cv"></canvas>
<div id="scan"></div>
<div id="top">MAGIC HUB</div>
<div id="hint">Loading... (10-15 sec)</div>
<div id="bar"></div>
<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = i => document.getElementById(i);
const cv = $('cv'), x = cv.getContext('2d'), v = $('v');
const lay = document.createElement('canvas'), lx = lay.getContext('2d');
let W = 0, H = 0, hl = null, cr = [0, 0, 1, 1];
function size(){ W = cv.width = lay.width = innerWidth; H = cv.height = lay.height = innerHeight; }
size(); addEventListener('resize', size);

const dv = () => x.drawImage(v, cr[0], cr[1], cr[2], cr[3], 0, 0, W, H);
const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function gesture(l){
  const w = l[0], hs = d2(w, l[9]);
  if(d2(l[4], l[8]) < hs * 0.3) return 'pinch';
  const e = [[8,6],[12,10],[16,14],[20,18]].map(p => d2(l[p[0]], w) > d2(l[p[1]], w) * 1.05);
  const n = e.filter(Boolean).length;
  if(n === 0) return 'fist';
  if(n === 4) return 'palm';
  if(e[0] && !e[1] && !e[2] && !e[3]) return 'point';
  if(e[0] && e[1] && !e[2] && !e[3]) return 'peace';
  return 'other';
}

// ---------- shared effects ----------
const ps = [], fl = {a: 0, c: '255,255,255'};
function burst(px, py, n, spd, hue){
  for(let i = 0; i < n; i++){
    const a = Math.random() * 6.283, s = Math.random() * spd;
    ps.push({x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 1, h: hue + Math.random() * 30});
  }
  if(ps.length > 700) ps.splice(0, ps.length - 700);
}

// ---------- MODE 1: ENERGY BALL ----------
const eb = {last: null, cd: 0, rings: []};
function ball(cx, cy, r){
  const g = x.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(120,230,255,.95)');
  g.addColorStop(.6, 'rgba(0,120,255,.5)'); g.addColorStop(1, 'rgba(0,60,255,0)');
  x.globalCompositeOperation = 'lighter';
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r * 1.6, 0, 7); x.fill();
  x.strokeStyle = 'rgba(200,240,255,.9)'; x.lineWidth = 2;
  for(let k = 0; k < 5; k++){
    let a = Math.random() * 6.283, px = cx + Math.cos(a) * r * .3, py = cy + Math.sin(a) * r * .3;
    x.beginPath(); x.moveTo(px, py);
    for(let s = 0; s < 5; s++){ a += (Math.random() - .5) * 1.2; px += Math.cos(a) * r * .35; py += Math.sin(a) * r * .35; x.lineTo(px, py); }
    x.stroke();
  }
  x.globalCompositeOperation = 'source-over';
}
const m1 = {n: '⚡ Energy', hint: 'Dono haath kholke paas laao, door karo = ball bada | dono ✊ = BLAST',
  draw(hs, dt, now){
    eb.cd -= dt;
    let on = false, cx, cy, r;
    if(hs.length === 2){
      const a = hs[0].c, b = hs[1].c;
      cx = (a[0] + b[0]) / 2; cy = (a[1] + b[1]) / 2;
      r = Math.max(25, Math.min(230, Math.hypot(a[0] - b[0], a[1] - b[1]) * .3));
      if(hs[0].g === 'fist' && hs[1].g === 'fist'){
        if(eb.last && eb.cd <= 0){
          burst(eb.last[0], eb.last[1], 260, 700, 200);
          eb.rings.push({x: eb.last[0], y: eb.last[1], r: eb.last[2], l: 1});
          fl.a = 1; fl.c = '180,230,255'; eb.cd = 1.2;
        }
        eb.last = null;
      } else on = true;
    } else if(hs.length === 1 && hs[0].g === 'palm'){
      cx = hs[0].c[0]; cy = hs[0].c[1] - 10; r = 38 + Math.sin(now * .01) * 5; on = true;
    }
    if(on){ ball(cx, cy, r); eb.last = [cx, cy, r]; burst(cx + (Math.random() - .5) * r * 2, cy + (Math.random() - .5) * r * 2, 1, 120, 190); }
    else if(!hs.length) eb.last = null;
    eb.rings = eb.rings.filter(o => o.l > 0);
    eb.rings.forEach(o => {
      o.r += dt * 900; o.l -= dt * 1.4;
      x.strokeStyle = 'rgba(170,235,255,' + o.l + ')'; x.lineWidth = 10 * o.l;
      x.beginPath(); x.arc(o.x, o.y, o.r, 0, 7); x.stroke();
    });
  }};

// ---------- MODE 2: PORTAL ----------
const po = [{r: 0, x: 0, y: 0}, {r: 0, x: 0, y: 0}];
const m2 = {n: '🌀 Portal', hint: '✋ Khula haath = portal khulta hai | ✊ = band',
  draw(hs, dt, now){
    po.forEach((p, i) => {
      const h = hs[i];
      if(h){ p.x = h.c[0]; p.y = h.c[1]; }
      const tg = (h && h.g === 'palm') ? 135 : 0;
      p.r += (tg - p.r) * Math.min(1, dt * 6);
      if(p.r < 5) return;
      x.save();
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.clip();
      x.setTransform(-1, 0, 0, -1, W, H); dv();
      x.setTransform(1, 0, 0, 1, 0, 0);
      x.fillStyle = 'rgba(255,110,0,.28)'; x.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      x.restore();
      x.globalCompositeOperation = 'lighter';
      for(let k = 0; k < 3; k++){
        x.strokeStyle = 'rgba(255,' + (140 + k * 30) + ',30,' + (.9 - k * .25) + ')';
        x.lineWidth = 14 - k * 5; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.stroke();
      }
      x.globalCompositeOperation = 'source-over';
      const a = now * .004 * (i ? -1 : 1);
      for(let k = 0; k < 3; k++){
        const an = a + k * 2.09, sx = p.x + Math.cos(an) * p.r, sy = p.y + Math.sin(an) * p.r;
        ps.push({x: sx, y: sy, vx: -Math.sin(an) * 350 + (Math.random() - .5) * 150, vy: Math.cos(an) * 350 + (Math.random() - .5) * 150, l: .8, h: 20 + Math.random() * 25});
      }
    });
  }};

// ---------- MODE 3: NEON DRAW ----------
const nd = {last: [null, null], sm: [null, null], hue: 180};
const m3 = {n: '✍️ Neon', hint: '☝️ Ek ungli se hawa me likho | ✊ = sab saaf',
  draw(hs){
    for(let i = 0; i < 2; i++){
      const h = hs[i];
      if(h && h.g === 'point'){
        const t = h.tip, s = nd.sm[i] || (nd.sm[i] = [t[0], t[1]]);
        s[0] += (t[0] - s[0]) * .5; s[1] += (t[1] - s[1]) * .5;
        const l = nd.last[i];
        if(l){
          nd.hue = (nd.hue + 2) % 360; lx.lineCap = 'round';
          [[18, .18, 60], [9, .45, 65], [3, 1, 92]].forEach(q => {
            lx.strokeStyle = 'hsla(' + nd.hue + ',100%,' + q[2] + '%,' + q[1] + ')';
            lx.lineWidth = q[0]; lx.beginPath(); lx.moveTo(l[0], l[1]); lx.lineTo(s[0], s[1]); lx.stroke();
          });
        }
        nd.last[i] = [s[0], s[1]];
        x.fillStyle = '#fff'; x.beginPath(); x.arc(s[0], s[1], 8, 0, 7); x.fill();
      } else {
        nd.last[i] = null; nd.sm[i] = null;
        if(h && h.g === 'fist') lx.clearRect(0, 0, W, H);
      }
    }
    x.globalCompositeOperation = 'lighter'; x.drawImage(lay, 0, 0); x.globalCompositeOperation = 'source-over';
  }};

// ---------- MODE 4: FRUIT NINJA ----------
const fn = {f: [], sc: 0, t: 0, tr: [[], []], E: ['🍉', '🍊', '🍎', '🍋', '🍇', '🍓']};
const m4 = {n: '🍉 Ninja', hint: 'Ungli tez chalao = fal kato | 💣 mat kaatna',
  draw(hs, dt){
    fn.t -= dt;
    if(fn.t <= 0){
      fn.t = .45 + Math.random() * .6;
      const bomb = Math.random() < .14, g = 1500, hh = H * (.5 + .3 * Math.random()), px = W * (.15 + .7 * Math.random());
      fn.f.push({x: px, y: H + 50, vx: (W / 2 - px) * .35 + (Math.random() - .5) * 160, vy: -Math.sqrt(2 * g * hh), r: 46,
        e: bomb ? '💣' : fn.E[Math.floor(Math.random() * 6)], b: bomb, a: 0});
    }
    fn.f.forEach(o => { o.vy += 1500 * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.a += dt * 2; });
    hs.forEach((h, i) => {
      const tr = fn.tr[i]; tr.push([h.tip[0], h.tip[1]]); if(tr.length > 9) tr.shift();
      if(h.sp > 900) fn.f = fn.f.filter(o => {
        if(Math.hypot(h.tip[0] - o.x, h.tip[1] - o.y) < o.r + 25){
          if(o.b){ fn.sc = Math.max(0, fn.sc - 5); fl.a = .8; fl.c = '255,40,40'; burst(o.x, o.y, 80, 500, 10); }
          else { fn.sc++; burst(o.x, o.y, 50, 450, Math.random() * 360); }
          return false;
        }
        return true;
      });
    });
    for(let i = hs.length; i < 2; i++) fn.tr[i] = [];
    fn.f = fn.f.filter(o => !(o.vy > 0 && o.y > H + 80));
    x.textAlign = 'center'; x.textBaseline = 'middle';
    fn.f.forEach(o => { x.save(); x.translate(o.x, o.y); x.rotate(o.a); x.font = (o.r * 2) + 'px serif'; x.fillText(o.e, 0, 0); x.restore(); });
    x.lineCap = 'round';
    fn.tr.forEach(tr => { for(let j = 1; j < tr.length; j++){
      x.strokeStyle = 'rgba(200,240,255,' + (j / tr.length) + ')'; x.lineWidth = j * 1.2;
      x.beginPath(); x.moveTo(tr[j-1][0], tr[j-1][1]); x.lineTo(tr[j][0], tr[j][1]); x.stroke(); } });
    x.fillStyle = '#fff'; x.font = 'bold 40px monospace'; x.fillText('SCORE ' + fn.sc, W / 2, 110);
  }};

// ---------- hub ----------
const MODES = [m1, m2, m3, m4];
let mi = 0;
const btns = MODES.map((m, i) => {
  const b = document.createElement('button'); b.textContent = m.n; b.onclick = () => setMode(i); $('bar').appendChild(b); return b;
});
function setMode(i){
  mi = i; $('hint').textContent = MODES[i].hint; $('top').textContent = 'MAGIC HUB // ' + MODES[i].n;
  btns.forEach((b, k) => b.classList.toggle('on', k === i));
}
setMode(0);

const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const prevT = [null, null];
let last = performance.now();

function loop(){
  try{
    const now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now;
    const vw = v.videoWidth, vh = v.videoHeight, s = Math.max(W / vw, H / vh), cw = W / s, ch = H / s;
    cr = [(vw - cw) / 2, (vh - ch) / 2, cw, ch];
    const toS = p => [W - ((p.x * vw - cr[0]) / cw * W), (p.y * vh - cr[1]) / ch * H];

    x.save(); x.setTransform(-1, 0, 0, 1, W, 0); dv(); x.restore();
    x.fillStyle = 'rgba(0,10,20,.3)'; x.fillRect(0, 0, W, H);

    const res = hl.detectForVideo(v, now);
    const hs = res.landmarks.slice(0, 2).map((l, i) => {
      const P = l.map(toS), tip = P[8];
      let sp = 0;
      if(prevT[i] && dt > 0) sp = Math.hypot(tip[0] - prevT[i][0], tip[1] - prevT[i][1]) / dt;
      prevT[i] = tip;
      return {P, g: gesture(l), tip, c: P[9], sp};
    });
    for(let i = hs.length; i < 2; i++) prevT[i] = null;

    x.lineCap = 'round'; x.beginPath();
    hs.forEach(h => BONES.forEach(b => { x.moveTo(h.P[b[0]][0], h.P[b[0]][1]); x.lineTo(h.P[b[1]][0], h.P[b[1]][1]); }));
    x.strokeStyle = 'rgba(0,255,255,.45)'; x.lineWidth = 2; x.stroke();

    MODES[mi].draw(hs, dt, now);

    x.globalCompositeOperation = 'lighter';
    for(let k = ps.length - 1; k >= 0; k--){
      const p = ps[k]; p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt * 1.2;
      if(p.l <= 0){ ps.splice(k, 1); continue; }
      x.fillStyle = 'hsla(' + p.h + ',100%,60%,' + p.l + ')'; x.fillRect(p.x, p.y, 4, 4);
    }
    x.globalCompositeOperation = 'source-over';

    if(fl.a > 0){ x.fillStyle = 'rgba(' + fl.c + ',' + (fl.a * .4) + ')'; x.fillRect(0, 0, W, H); fl.a -= dt * 2.5; }

    x.strokeStyle = '#0ff'; x.lineWidth = 3; x.lineCap = 'butt';
    const L = 44, m = 14;
    [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(c => {
      x.beginPath(); x.moveTo(c[0] + c[2] * L, c[1]); x.lineTo(c[0], c[1]); x.lineTo(c[0], c[1] + c[3] * L); x.stroke();
    });
  } catch(e){
    $('hint').textContent = 'Error: ' + e.message; return;
  }
  requestAnimationFrame(loop);
}

async function main(){
  try{
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const mk = async f => { try{ return await f("GPU"); } catch(e){ return await f("CPU"); } };
    hl = await mk(dl => HandLandmarker.createFromOptions(fs, {
      baseOptions: {modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: dl},
      runningMode: "VIDEO", numHands: 2}));
    v.srcObject = await navigator.mediaDevices.getUserMedia({video: {facingMode: "user"}});
    await v.play();
    requestAnimationFrame(loop);
  } catch(e){
    $('hint').textContent = 'Error: ' + e.message;
  }
}
main();
</script>
</body>
</html>
